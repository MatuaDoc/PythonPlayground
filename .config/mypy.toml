[tool.mypy]
python_version = "3.14"
strict = true

# Extra strictness flags NOT included in `strict = true`
disallow_any_unimported = true
disallow_any_expr = false            # Warning: flags almost all untyped stdlib/3rd-party calls if true
disallow_any_decorated = true
disallow_any_explicit = true
disallow_any_generics = true
disallow_subclassing_any = true

# Catch unreachable code, redundant casts, and unused ignores
warn_unreachable = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_no_return = true

# Strict equality and truthiness checks
strict_equality = true
strict_concatenate = true

# Optional error codes beyond `--strict`
enable_error_code = [
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
    "truthy-iterable",
    "possibly-undefined",
    "explicit-override",
    "mutable-override",
    "unimported-reveal",
]