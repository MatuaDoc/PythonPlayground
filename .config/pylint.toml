[tool.pylint.main]
init-hook = "import sys; sys.path.insert(0, '.config')"
load-plugins = [
    "pylint_explicit_booleans",
    "pylint_explicit_conversions",
    "pylint_explicit_optionals",
    "pylint_prefer_guard",
    "pylint_prefer_structured_data",
    "pylint_required_annotations",
    "pylint_required_arg_labels"
]

[tool.pylint.messages_control]
disable = ["all"]

enable = [
    "exhaustive-match",
    "implicit-optional-check",
    "implicit-numeric-conversion",
    "missing-variable-annotation",
    "missing-argument-label",
    "non-boolean-condition",
    "prefer-guard",
    "prefer_structured_data"
]